name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "${{ runner.temp }}/appmixer-release.jks"

      - name: Build signed release APK
        env:
          APPMIXER_KEYSTORE_PATH: ${{ runner.temp }}/appmixer-release.jks
          APPMIXER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APPMIXER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APPMIXER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$apk" "out/appmixer-${{ github.event.inputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "AppMixer ${{ github.event.inputs.tag }}"
          body: |
            AppMixer build, signed with the project's release key so it can be installed over previous signed releases as a normal update.

            Requires Android 13+ and [Shizuku](https://shizuku.rikka.app/).
          prerelease: true
          files: out/appmixer-${{ github.event.inputs.tag }}.apk
