name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/appmixer-${{ github.event.inputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "AppMixer ${{ github.event.inputs.tag }}"
          body: |
            First downloadable build of **AppMixer**, a fork of [yume-chan/VolumeManager](https://github.com/yume-chan/VolumeManager) reworked with a Nothing OS inspired black/white/red theme.

            This is an **unsigned debug build** (self-signed with Android's default debug key), meant for early testing. To install it you'll need to allow "install from unknown sources" for the app you download it with.

            Requires Android 13+ and [Shizuku](https://shizuku.rikka.app/).
          prerelease: true
          files: out/appmixer-${{ github.event.inputs.tag }}.apk
