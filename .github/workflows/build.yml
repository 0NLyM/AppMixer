on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # Only the base repo has the signing secrets (forks/PRs don't), so this
      # step is skipped there and assembleRelease below falls back to an
      # unsigned build -- still useful to validate the build itself.
      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_FILE != '' }}
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "${{ runner.temp }}/appmixer-release.jks"

      - name: Build release APK
        env:
          APPMIXER_KEYSTORE_PATH: ${{ secrets.KEYSTORE_FILE != '' && format('{0}/appmixer-release.jks', runner.temp) || '' }}
          APPMIXER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APPMIXER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APPMIXER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$apk" out/appmixer.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: out/appmixer.apk
          archive: false
