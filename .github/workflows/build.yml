on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The `secrets` context isn't available in step `if:` conditions, so the
    # keystore secret is surfaced as a job env var the conditions can read.
    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # Only the base repo has the signing secrets (forks/PRs don't), so this
      # step is skipped there, NOMIXER_KEYSTORE_PATH stays unset, and
      # assembleRelease below falls back to an unsigned build -- still useful
      # to validate that the build itself compiles.
      - name: Decode signing keystore
        if: env.KEYSTORE_FILE != ''
        run: |
          echo "$KEYSTORE_FILE" | base64 -d > "${{ runner.temp }}/nomixer-release.jks"
          echo "NOMIXER_KEYSTORE_PATH=${{ runner.temp }}/nomixer-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          NOMIXER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NOMIXER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOMIXER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$apk" out/nomixer.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: out/nomixer.apk
          archive: false
